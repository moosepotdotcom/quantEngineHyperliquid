version: '3.8'

services:
  mandalorian-dashboard:
    build: .
    container_name: mandalorian-dashboard
    ports:
      - "5001:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app:/app/dashboard:$PYTHONPATH
    restart: unless-stopped
    # Limit memory usage to prevent VPS crashes
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
