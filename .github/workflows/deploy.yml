name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - production
    tags:
      - 'v*'

env:
  PROJECT_ID: graphical-fort-427204-t3
  SERVICE_NAME: quant-engine-hl
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.PROJECT_ID }}
        
    - name: Configure Docker
      run: gcloud auth configure-docker
      
    - name: Get version from tag or commit
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(git rev-parse --short HEAD)
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Build Docker image
      run: |
        docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ steps.version.outputs.VERSION }} .
        docker tag gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ steps.version.outputs.VERSION }} gcr.io/$PROJECT_ID/$SERVICE_NAME:latest
        
    - name: Push Docker image
      run: |
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ steps.version.outputs.VERSION }}
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest
        
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ steps.version.outputs.VERSION }} \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars="ENABLE_LIVE_TRADING=true,USE_TESTNET=false" \
          --set-secrets="HYPERLIQUID_API_SECRET=hyperliquid-private-key:latest" \
          --memory 2Gi \
          --cpu 2 \
          --timeout 3600 \
          --concurrency 1 \
          --min-instances 1 \
          --max-instances 1 \
          --tag ${{ steps.version.outputs.VERSION }}
          
    - name: Create deployment record
      run: |
        echo "Deployed version ${{ steps.version.outputs.VERSION }} at $(date)" >> deployments.log
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add deployments.log
        git commit -m "Deploy: ${{ steps.version.outputs.VERSION }}" || true
